# SPA: неизвестные пути — index.html (маршруты решает клиент).
# Образ nginx-unprivileged: процесс без root, поэтому порт 8080, а не 80.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header в location отменяет заголовки уровня server — поэтому
    # заголовки безопасности повторены в каждом location.

    # Файлы сборки с хешем в имени — навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html — всегда свежий: иначе после деплоя браузер ищет старые бандлы.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
