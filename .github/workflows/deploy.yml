name: Deploy

# Сборка и запуск на хосте по SSH (make deploy). Хост — переменная репозитория
# DEPLOY_HOST (по умолчанию 147.45.245.104), ключ — секрет SSH_PRIVATE_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.45.245.104' }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Хост в known_hosts
        run: ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Настройки деплоя
        run: sed "s/^SSH_HOST=.*/SSH_HOST=$DEPLOY_HOST/" .env.deploy.example > .env.deploy

      - name: Деплой
        run: make deploy
